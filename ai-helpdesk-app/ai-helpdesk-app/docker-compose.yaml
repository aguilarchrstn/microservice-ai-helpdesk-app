services:
  chat-service:
    build: ./services/chat-service
    ports:
      - "8000:8000"
    environment:
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_MODEL: ${AI_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}
      AI_SITE_URL: ${AI_SITE_URL:-http://localhost:8080}
      AI_SITE_NAME: "IT Helpdesk Assistant"
      CORS_ORIGINS: "*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - chat-service
