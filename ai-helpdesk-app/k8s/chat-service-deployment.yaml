apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: chat-service
  template:
    metadata:
      labels:
        io.kompose.service: chat-service
    spec:
      containers:
        - name: chat-service
          image: ai-helpdesk-chat:latest
          imagePullPolicy: IfNotPresent     # <-- Move here
          ports:
            - containerPort: 8000
      restartPolicy: Always                 # <-- Set to Always
