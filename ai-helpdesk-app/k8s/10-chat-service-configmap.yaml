apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-service-config
  namespace: it-helpdesk
data:
  AI_BASE_URL: "https://openrouter.ai/api/v1"
  AI_MODEL: "nvidia/nemotron-3-ultra-550b-a55b:free"
  AI_SITE_URL: "http://helpdesk.example.com" # replace with your real host/IP
  AI_SITE_NAME: "IT Helpdesk Assistant"
  AI_TEMPERATURE: "0.3"
  AI_MAX_TOKENS: "800"
  CORS_ORIGINS: "*"
  LOG_LEVEL: "INFO"
  MAX_HISTORY_TURNS: "12"
