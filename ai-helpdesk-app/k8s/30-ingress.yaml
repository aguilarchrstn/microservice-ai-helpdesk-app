# Requires an ingress controller (e.g. ingress-nginx) installed in the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: it-helpdesk-ingress
  namespace: it-helpdesk
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: helpdesk.example.com # replace with your real hostname
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
