# DO NOT commit a real key. Copy this file to 11-chat-service-secret.yaml,
# fill in the real value, and keep that file out of version control
# (it's already covered by the .gitignore in this repo).
#
# Or, better for real deployments: create the secret imperatively instead of
# committing any yaml with a key in it:
#
#   kubectl create secret generic chat-service-secret \
#     --namespace=it-helpdesk \
#     --from-literal=AI_API_KEY=your-real-key-here
apiVersion: v1
kind: Secret
metadata:
  name: chat-service-secret
  namespace: it-helpdesk
type: Opaque
stringData:
  AI_API_KEY: "replace-with-your-nvidia-build-api-key"
