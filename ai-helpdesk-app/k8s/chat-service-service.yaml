apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
        - name: chat-service
          image: ai-helpdesk-chat:latest
          ports:
            - containerPort: 5000
          # Inject AI_API_KEY, AI_BASE_URL, and AI_MODEL into the container environment
          envFrom:
            - secretRef:
                name: ai-helpdesk-secret
