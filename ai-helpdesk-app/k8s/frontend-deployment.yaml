apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: frontend
  template:
    metadata:
      labels:
        io.kompose.service: frontend
    spec:
      containers:
        - name: frontend
          image: ai-helpdesk-frontend:latest
          imagePullPolicy: IfNotPresent      # <-- MUST BE INSIDE CONTAINERS
          ports:
            - containerPort: 8080
      restartPolicy: Always                  # <-- MUST BE "Always" FOR DEPLOYMENTS
