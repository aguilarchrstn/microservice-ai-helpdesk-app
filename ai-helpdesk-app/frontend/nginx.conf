server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Inside the cluster, proxy same-origin /api calls straight to the
    # chat-service ClusterIP Service. This keeps the browser talking to a
    # single origin and avoids CORS entirely in production.
    location /api/ {
        proxy_pass http://chat-service:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 65s;
    }
}
