server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy same-origin /api calls straight to the chat-service container
    # (Docker Compose gives containers DNS names matching their service
    # name). This keeps the browser talking to a single origin and avoids
    # CORS entirely.
    location /api/ {
        proxy_pass http://chat-service:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 65s;
    }
}
